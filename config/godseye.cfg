; God's Eye mod configuration.
; Loaded by the engine from config/godseye.cfg after mods are mounted
; (see MountMods in GameSetup.cpp). Values here override default.cfg.

[fonts.godseye]
; Display face for God's Eye titles. Cinzel Bold (OFL 1.1, see fonts/Cinzel-OFL.txt).
; Use font="godseye-bold-<size>" in GUI XML (gui.rng in this mod allows the godseye alias).
regular = "Cinzel-Bold.ttf"
bold = "Cinzel-Bold.ttf"
